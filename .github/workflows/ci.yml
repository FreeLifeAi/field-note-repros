name: Field Note Reproductions CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 Synthetic Verifiers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify zero external npm dependencies
        run: test ! -d node_modules

      - name: Run Field Note 01, 02, and 03 verifiers
        run: npm test
